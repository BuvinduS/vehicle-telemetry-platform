# pi/broker/mosquitto.conf
# LAN-only, no cloud bridging (architecture.md §2.1, §4).

listener 1883
protocol mqtt

# Websocket listener kept available for the FastAPI bridge / any browser-side
# debugging tooling that wants to subscribe directly without going through
# the bridge. Separate port so it can be disabled later without touching 1883.
listener 9001
protocol websockets

# Dev-phase auth: none. LAN-only + mobile-hotspot deployment per
# architecture.md — revisit if this ever leaves a trusted network.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
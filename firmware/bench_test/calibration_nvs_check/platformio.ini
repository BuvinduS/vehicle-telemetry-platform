; Nested bench_test project, same pattern as imu_orientation_check.
; Run `pio run -t upload` from inside THIS directory
; (firmware/bench_test/calibration_nvs_check/), not from firmware/.
;
; NOTE: copy the [env:esp32-s3] board/platform settings from your real
; firmware/platformio.ini so this matches your actual board config --
; I don't have that file in front of me to copy exactly.
 
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1     ; <-- confirm this matches your main platformio.ini
framework = arduino
 
; Reuses the SAME lib/calibration_nvs and lib/calibration_serializer
; code from the main firmware project -- no duplication.
lib_extra_dirs = ../../lib
 
monitor_speed = 115200
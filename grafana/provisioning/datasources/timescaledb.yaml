apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: TimescaleDB
    type: postgres
    access: proxy
    url: ${TIMESCALEDB_HOST}:${TIMESCALEDB_PORT}
    database: ${TIMESCALEDB_DB}
    user: ${TIMESCALEDB_USER}
    secureJsonData:
      password: ${TIMESCALEDB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: false